<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Editar Perfil</title>
    <link rel="icon" href="./assets/icon/holofocus-06 1.png" />
    <link rel="stylesheet" href="css/editarPerfil.css">
    <script src="./js/elementosPadrao.js"></script>
</head>

<body onload="validarSessao()">
    <button onclick="voltar()" class="botao-voltar">↩</button>

    <svg class="svg">
        <path class="path"></path>
    </svg>
    <svg>
        <path></path>
    </svg>


    <div class="container">
        <div class="card">
            <div class="topo">
                <h2><strong>Editar perfil </strong></h2>
                <button onclick="voltar()" class="btx"><img src="assets/imgs/IconX.png" alt=""></button>
            </div>

            <form id="formEditarPerfil">
                <label>Nome</label>
                <input type="text" id="inputNome">

                <div class="linha">
                    <div class="campo">
                        <label>E-mail</label>
                        <input type="email" id="inputEmail">
                    </div>

                    <div class="campo">
                        <label>Celular</label>
                        <input type="text" id="inputCelular" placeholder="(99) 99999-9999">
                    </div>
                </div>

                <label>Senha</label>
                <input type="password" id="inputSenha">

                <label>Confirma senha</label>
                <input type="password" id="inputConfirmarSenha">

                <label>Nível de permissão</label>
                <select id="selectPermissao">
                    <option value="">selecionar</option>
                </select>

                <button type="submit">SALVAR</button>
            </form>
        </div>
    </div>

</body>
<script></script>

</html>
