<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Editar Perfil</title>
    <link rel="icon" href="./assets/icon/holofocus-06 1.png">
    <link rel="stylesheet" href="css/editarPerfil.css">
    <script src="./js/elementosPadrao.js"></script>
</head>

<body onload="validarSessao()">
    <button onclick="voltar()" class="botao-voltar">&larr;</button>

    <svg class="svg"><path class="path"></path></svg>
    <svg><path></path></svg>

    <div class="container">
        <div class="card">
            <div class="topo">
                <h2><strong>Editar perfil</strong></h2>
                <button onclick="voltar()" class="btx">
                    <img src="assets/imgs/IconX.png" alt="Fechar">
                </button>
            </div>

            <!-- IDs adicionados para carregar e salvar os dados pela rota de usuários. -->
            <form id="form-editar-perfil">
                <label>Nome</label>
                <input id="perfil-nome" type="text" required>

                <div class="linha">
                    <div class="campo">
                        <label>E-mail</label>
                        <input id="perfil-email" type="email" required>
                    </div>
                    <div class="campo">
                        <label>Celular</label>
                        <input id="perfil-telefone" type="text" placeholder="(99) 99999-9999" required>
                    </div>
                </div>

                <label>Senha</label>
                <input id="perfil-senha" type="password" placeholder="Preencha somente para alterar">

                <label>Confirma senha</label>
                <input id="perfil-confirmar-senha" type="password">

                <label>Nível de permissão</label>
                <select id="perfil-nivel" required></select>

                <button type="submit">SALVAR</button>
            </form>
        </div>
    </div>

    <!-- Conecta este formulário ao backend de usuários. -->
    <script src="./js/editarPerfil.js"></script>
</body>
</html>
