<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Usuários - Holofocus</title><link rel="stylesheet" href="css/lista-usuario.css">
  <script src="./js/elementosPadrao.js"></script>
</head>
<body onload="isAdm()">
<div class="container">
  <aside class="sidebar" id="__header">
        <img id="logo__header" src="assets/imgs/holofocus-06.svg" alt="logo holofocus">
        <ul id="ul_navbar"></ul>

        <div class="user">
            <div class="usuario-info">
                <p id="nome_usuario"></p>
                <img id="icon__admin" src="./assets/icon/icon-admin.png" alt="Icone de admin">
            </div>
            <a class="conf" id="btt___configuracoes" href="editarPerfil.html"><img
                    src="./assets/icon/icon-configuracoes.svg" alt="Icone de configurações"> Configurações</a>
            <button class="logout" id="btt__sair" onclick="logout()"><img src="assets/imgs/iconSaida.png"
                    alt=""><strong>
                    Sair</strong></button>
        </div>
    </aside>
  <main class="main"><div class="header"><h1>Todos Usuários</h1><div class="actions">
    <input id="pesquisa-usuario" placeholder="Pesquisar"><button class="btn-yellow" onclick="abrirModal('cadastrar')"><img src="assets/imgs/iconMais.png" alt=""></button>
  </div></div>
  <!-- usuario.js preenche a tabela somente com usuários da empresa logada. -->
  <table><thead><tr><th>Nome</th><th>Telefone</th><th>Email</th><th>Nível</th><th></th></tr></thead><tbody id="corpo-usuarios"></tbody></table>
  </main>
</div>
<div class="desfoque" id="desfoque-cadastrar"><div class="overlay" id="overlay-cadastrar" onclick="fecharOverlay(event,'cadastrar')"><div class="modal"><div class="cardP">
  <div class="topo"><h2>Cadastrar Usuário</h2><button type="button" class="btx" onclick="fecharModal('cadastrar')">X</button></div>
  <form id="form-cadastrar-usuario"><label>Nome</label><input id="usuario-nome" required>
    <div class="linha"><div class="campo"><label>E-mail</label><input id="usuario-email" type="email" required></div><div class="campo"><label>Celular</label><input id="usuario-telefone" required></div></div>
    <label>Senha</label><input id="usuario-senha" type="password" required><label>Confirmar senha</label><input id="usuario-confirmar" type="password" required>
    <label>Nível de permissão</label><select id="usuario-nivel" required></select><button class="buttonP">SALVAR</button>
  </form>
</div></div></div></div>
<div class="desfoque" id="desfoque-editar"><div class="overlay" id="overlay-editar" onclick="fecharOverlay(event,'editar')"><div class="modal"><div class="cardE">
  <div class="topo"><h2>Editar Usuário</h2><button type="button" class="btx2" onclick="fecharModal('editar')">X</button></div>
  <form id="form-editar-usuario"><label>Nome</label><input id="editar-usuario-nome" required>
    <div class="linha"><div class="campo"><label>E-mail</label><input id="editar-usuario-email" type="email" required></div><div class="campo"><label>Celular</label><input id="editar-usuario-telefone" required></div></div>
    <label>Nível de permissão</label><select id="editar-usuario-nivel" required></select>
    <button class="buttonS">SALVAR</button><button id="excluir-usuario" type="button" class="buttonE">EXCLUIR</button>
  </form>
</div></div></div></div>
<script>
function abrirModal(id){document.getElementById('overlay-'+id).classList.add('open');document.getElementById('desfoque-'+id).classList.add('open')}
function fecharModal(id){document.getElementById('overlay-'+id).classList.remove('open');document.getElementById('desfoque-'+id).classList.remove('open')}
function fecharOverlay(e,id){if(e.target===document.getElementById('overlay-'+id))fecharModal(id)}
</script>
<script src="./js/elementosPadrao.js"></script><script src="./js/navbar.js"></script><script src="./js/usuario.js"></script>
</body></html>
