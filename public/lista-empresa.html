<!DOCTYPE html><html lang="pt-br"><head><meta charset="UTF-8"><title>Empresas - Holofocus</title><link rel="stylesheet" href="css/lista-empresa.css"></head>
<body onload="isAdm()"><div class="container"><aside class="sidebar" id="__header"><img id="logo__header" src="assets/imgs/holofocus-06.svg" alt=""><ul id="ul_navbar"></ul>
<div class="user"><div class="usuario-info"><p id="nome_usuario"></p><img id="icon__admin" src="./assets/icon/icon-admin.png" alt=""></div><a class="conf" href="editarPerfil.html">Configurações</a><button class="logout" onclick="logout()">Sair</button></div></aside>
<main class="main"><div class="header"><h1>Empresas Cadastradas</h1><div class="actions"><input id="pesquisa-empresa" placeholder="Pesquisar"></div></div>
<table><thead><tr><th>Nome</th><th>Usuários</th><th>Eventos</th><th></th></tr></thead><tbody id="corpo-empresas"></tbody></table></main></div>
<div class="desfoque" id="desfoque-editar"><div class="overlay" id="overlay-editar" onclick="fecharOverlay(event,'editar')"><div class="modal"><div class="cardE">
<div class="topo"><h2>Editar Empresa</h2><button type="button" class="btx" onclick="fecharModal('editar')">X</button></div>
<form id="form-editar-empresa"><label>Razão social</label><input id="empresa-razao" required><div class="linha"><div class="campo"><label>CNPJ</label><input id="empresa-cnpj" required></div><div class="campo"><label>Lotação</label><input id="empresa-lotacao" type="number" min="0"></div></div>
<h4>Endereço</h4><label>Logradouro</label><input id="empresa-logradouro" required><div class="linha2"><div class="campo"><label>CEP</label><input id="empresa-cep" required></div><div class="campo"><label>Número</label><input id="empresa-numero" required></div><div class="campo"><label>Complemento</label><input id="empresa-complemento"></div></div>
<button class="buttonS">SALVAR</button><button id="excluir-empresa" type="button" class="buttonE">EXCLUIR</button></form>
</div></div></div></div>
<script>function abrirModal(id){document.getElementById('overlay-'+id).classList.add('open');document.getElementById('desfoque-'+id).classList.add('open')}function fecharModal(id){document.getElementById('overlay-'+id).classList.remove('open');document.getElementById('desfoque-'+id).classList.remove('open')}function fecharOverlay(e,id){if(e.target===document.getElementById('overlay-'+id))fecharModal(id)}</script>
<script src="./js/elementosPadrao.js"></script><script src="./js/navbar.js"></script><script src="./js/empresa.js"></script></body></html>
