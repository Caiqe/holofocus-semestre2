<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Chamados - Holofocus</title>
    <link rel="stylesheet" href="./css/lista-chamados.css">
    <script src="./js/elementosPadrao.js"></script>
</head>

<body onload="validarSessao()">
    <div class="container">
        <aside class="sidebar" id="__header">
        <img id="logo__header" src="assets/imgs/holofocus-06.svg" alt="logo holofocus">
        <ul id="ul_navbar"></ul>

        <div class="user">
            <div class="usuario-info">
                <p id="nome_usuario"></p>
                <img id="icon__admin" src="./assets/icon/icon-admin.png" alt="Icone de admin">
            </div>
            <a class="conf" id="btt___configuracoes" href="editarPerfil.html"><img
                    src="./assets/icon/icon-configuracoes.svg" alt="Icone de configurações"> Configurações</a>
            <button class="logout" id="btt__sair" onclick="logout()"><img src="assets/imgs/iconSaida.png"
                    alt=""><strong>
                    Sair</strong></button>
        </div>
    </aside>
        <main class="main">
            <div class="header">
                <h1>Lista de chamados</h1>
                <div class="actions"><input id="pesquisa-chamado" placeholder="Pesquisar"><button class="btn-yellow"
                        onclick="abrirModal('cadastrar')"><img src="./assets/imgs/iconMais.png" alt=""></button></div>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>Identificação</th>
                        <th>Data de solicitação</th>
                        <th>Status</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="corpo-chamados"></tbody>
            </table>
        </main>
    </div>
    <div class="desfoque" id="desfoque-cadastrar">
        <div class="overlay" id="overlay-cadastrar" onclick="fecharOverlay(event,'cadastrar')">
            <div class="modal">
                <div class="cardP">
                    <div class="topo">
                        <h2>Abrir chamado</h2><button type="button" class="btx"
                            onclick="fecharModal('cadastrar')">X</button>
                    </div>
                    <form id="form-cadastrar-chamado"><label>Assunto</label><input id="chamado-assunto"
                            required><label>Descrição</label><textarea id="chamado-descricao"
                            required></textarea><button class="buttonP">SALVAR</button></form>
                </div>
            </div>
        </div>
    </div>
    <div class="desfoque" id="desfoque-Visualizar">
        <div class="overlay tamanho" id="overlay-Visualizar" onclick="fecharOverlay(event,'Visualizar')">
            <div class="modal">
                <div class="cardE">
                    <div class="topo">
                        <h2>Visualizar chamado</h2><button type="button" class="btx2"
                            onclick="fecharModal('Visualizar')">X</button>
                    </div>
                    <form id="form-chamado-status"><label>Assunto</label><input id="visualizar-chamado-assunto"
                            readonly><label>Descrição</label><textarea id="visualizar-chamado-descricao"
                            readonly></textarea>
                        <label>Status</label><select id="visualizar-chamado-status">
                            <option value="ABERTO">Aberto</option>
                            <option value="EM_ANDAMENTO">Em andamento</option>
                            <option value="CONCLUIDO">Concluído</option>
                            <option value="ENCERRADO">Encerrado</option>
                        </select>
                        <button class="buttonS">SALVAR</button><button id="excluir-chamado" type="button"
                            class="buttonE">EXCLUIR</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <script>function abrirModal(id) { document.getElementById('overlay-' + id).classList.add('open'); document.getElementById('desfoque-' + id).classList.add('open') } function fecharModal(id) { document.getElementById('overlay-' + id).classList.remove('open'); document.getElementById('desfoque-' + id).classList.remove('open') } function fecharOverlay(e, id) { if (e.target === document.getElementById('overlay-' + id)) fecharModal(id) }</script>
    <script src="./js/elementosPadrao.js"></script>
    <script src="./js/navbar.js"></script>
    <script src="./js/chamado.js"></script>
</body>
<script src="./js/navbar.js"></script>
</html>
